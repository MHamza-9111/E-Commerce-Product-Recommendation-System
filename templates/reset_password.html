{% extends "base.html" %}
{% block title %}Choose New Password{% endblock %}

{% block content %}
<div class="row justify-content-center py-lg-4">
    <div class="col-md-7 col-lg-5">
        <div class="shop-surface p-4 p-md-5" data-reveal>
            <div class="text-center mb-4">
                <span class="auth-eyebrow mb-2">Secure your account</span>
                <h1 class="h3 fw-800 mb-2" style="letter-spacing:-.04em;">Choose a new password</h1>
                <p class="text-muted mb-0" style="font-size:.82rem;">Enter the new password twice to confirm it.</p>
            </div>
            <form method="POST" data-submit-label="Updating password…">
                <div class="mb-3">
                    <label class="form-label" for="new-password">New password</label>
                    <div class="input-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input id="new-password" type="password" name="password" class="form-control" minlength="6" autocomplete="new-password" data-password-input required>
                        <button class="password-toggle" type="button" data-password-toggle="new-password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirm-password">Confirm password</label>
                    <div class="input-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input id="confirm-password" type="password" name="confirm_password" class="form-control" minlength="6" autocomplete="new-password" data-password-input required>
                        <button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Update password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
