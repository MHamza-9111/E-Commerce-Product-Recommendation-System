{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="row justify-content-center py-lg-4">
    <div class="col-md-7 col-lg-5">
        <div class="shop-surface p-4 p-md-5 text-center" data-reveal>
            <span class="empty-state-icon mb-3" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <span class="auth-eyebrow mb-2">Account recovery</span>
            <h1 class="h3 fw-800 mb-2" style="letter-spacing:-.04em;">Reset your password</h1>
            <p class="text-muted mb-4" style="font-size:.82rem;line-height:1.65;">Enter the email connected to your Cartify account and we will create a secure reset link.</p>

            <form method="POST" class="text-start" data-submit-label="Preparing reset link…">
                <div class="mb-3">
                    <label class="form-label" for="reset-email">Email address</label>
                    <div class="input-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="m4 6 8 6 8-6"/></svg>
                        <input id="reset-email" type="email" name="email" class="form-control" placeholder="you@example.com" autocomplete="email" required autofocus>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Send reset link</button>
            </form>

            <a href="{{ url_for('login') }}" class="auth-link d-inline-block mt-4" style="font-size:.75rem;">← Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
