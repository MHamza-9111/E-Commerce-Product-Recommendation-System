<!-- ApBot shopping assistant -->
<div class="apbot-shell"
     id="apbot"
     data-api-url="{{ url_for('chatbot_api') }}"
     data-products-url="{{ url_for('products') }}"
     data-sale-url="{{ url_for('index') }}#azaadi-sale"
     data-orders-url="{{ url_for('order_history') }}"
     data-cart-url="{{ url_for('view_cart') }}"
     data-checkout-url="{{ url_for('checkout') }}"
     data-profile-url="{{ url_for('profile') }}">
    <div class="apbot-nudge" id="apbotNudge" role="status" aria-live="polite" hidden>
        <button type="button" class="apbot-nudge-main" id="apbotNudgeOpen" aria-label="Open ApBot">
            <span class="apbot-nudge-logo"><img src="{{ url_for('static', filename='logo.png') }}" alt=""></span>
            <span class="apbot-nudge-copy"><strong>Welcome to ZiloCart</strong><small>Hi, I’m ApBot. How can I help you today?</small></span>
        </button>
        <button type="button" class="apbot-nudge-close" id="apbotNudgeClose" aria-label="Dismiss welcome message">
            <svg class="ui-icon"><use href="#icon-x"></use></svg>
        </button>
    </div>

    <section class="apbot-window" id="apbotWindow" aria-label="ApBot shopping assistant" hidden>
        <div class="apbot-panel">
            <header class="apbot-header" id="apbotDragHandle" title="Drag to move">
                <div class="apbot-header-info">
                    <span class="apbot-avatar" aria-hidden="true">
                        <img src="{{ url_for('static', filename='logo.png') }}" alt="">
                    </span>
                    <span>
                        <strong>ApBot</strong>
                        <small><span class="apbot-online-dot"></span>Ready to help</small>
                    </span>
                </div>
                <div class="apbot-header-actions">
                    <span class="apbot-drag-grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
                    <button type="button" class="apbot-close" id="apbotClose" aria-label="Close ApBot">
                        <svg class="ui-icon"><use href="#icon-x"></use></svg>
                    </button>
                </div>
            </header>

            <div class="apbot-messages" id="apbotMessages" aria-live="polite">
                <div class="apbot-welcome">
                    <span class="apbot-welcome-icon"><img src="{{ url_for('static', filename='logo.png') }}" alt=""></span>
                    <strong>Hi, I’m ApBot</strong>
                    <p>How can I help you today? Ask me to find products, explain details, recommend options, track orders or guide you through checkout.</p>
                </div>
            </div>

            <div class="apbot-quick-actions" aria-label="Suggested questions">
                <button type="button" class="apbot-quick-button" data-apbot-message="Recommend something for me">Find a product</button>
                <button type="button" class="apbot-quick-button" data-apbot-message="Where is my order?">Track an order</button>
                <button type="button" class="apbot-quick-button" data-apbot-message="What is your return policy?">Returns</button>
                <button type="button" class="apbot-quick-button" data-apbot-message="What is your toll-free customer support number?">Call support</button>
            </div>

            <form class="apbot-form" id="apbotForm">
                <label class="visually-hidden" for="apbotInput">Message ApBot</label>
                <input type="text" class="apbot-input" id="apbotInput" maxlength="500" placeholder="Type your question..." autocomplete="off" required>
                <button type="submit" class="apbot-send" id="apbotSend" aria-label="Send message">
                    <svg class="ui-icon"><use href="#icon-chevron-right"></use></svg>
                </button>
            </form>
        </div>
    </section>

    <button type="button" class="apbot-toggle" id="apbotToggle" aria-label="Open ApBot" aria-expanded="false">
        <img class="apbot-open-icon" src="{{ url_for('static', filename='logo.png') }}" alt="">
        <svg class="ui-icon apbot-close-icon"><use href="#icon-x"></use></svg>
        <span class="apbot-status" aria-hidden="true"></span>
    </button>
</div>
